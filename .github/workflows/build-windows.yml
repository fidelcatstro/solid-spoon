name: Build Windows Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag name to attach the Windows package to as a release artifact'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $PWD 'windows-build'
          if (Test-Path $artifactDir) { Remove-Item -Recurse -Force $artifactDir }
          New-Item -ItemType Directory -Path $artifactDir | Out-Null

          Copy-Item -Recurse -Force 'dist' (Join-Path $artifactDir 'dist')
          Copy-Item -Recurse -Force 'public' (Join-Path $artifactDir 'public')
          Copy-Item -Recurse -Force 'node_modules' (Join-Path $artifactDir 'node_modules')
          Copy-Item -Force 'package.json' (Join-Path $artifactDir 'package.json')
          Copy-Item -Force 'package-lock.json' (Join-Path $artifactDir 'package-lock.json')
          Copy-Item -Force 'README.md' (Join-Path $artifactDir 'README.md')

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set NODE_ENV=production
          node dist\index.cjs
          '@ | Set-Content -Path (Join-Path $artifactDir 'start.bat') -Encoding ASCII

          $zipPath = Join-Path $PWD 'solid-spoon-windows.zip'
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $artifactDir '*') -DestinationPath $zipPath -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: solid-spoon-windows
          path: solid-spoon-windows.zip
          if-no-files-found: error

      - name: Attach Windows package to GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          files: solid-spoon-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
