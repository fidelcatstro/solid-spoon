name: Build Windows Installer

on:
  push:
    branches: [ electron-desktop ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build client and bundle server
        run: npm run build

      - name: Install NSIS and 7zip
        shell: powershell
        run: |
          choco install -y nsis 7zip

      - name: Build Windows NSIS installer
        run: npm run electron:build:nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/**
